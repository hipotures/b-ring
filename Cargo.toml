[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.125"
edition = "2024"
rust-version = "1.100"
license = "CC0-1.0"
repository = "https://github.com/hipotures/b-ring"
publish = false

[workspace.dependencies]
bring-core = { path = "crates/bring-core" }
bring-uniffi = { path = "crates/bring-uniffi" }
uniffi = "0.32.2"

blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.9", features = ["derive"] }
hkdf = "0.12.4"
hmac = "0.12.1"
spake2 = "0.4.0"
getrandom = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"

axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
mime_guess = "2.0.5"
notify-rust = "4.19.0"
qrcode = { version = "0.15.0", default-features = false, features = ["std"] }
zbus = { version = "6.5.0", default-features = false, features = ["default-rt", "proxy", "service", "object-manager"] }
notify-debouncer-full = { version = "0.8.0", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "signal", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
rcgen = "0.14.10"
rustix = { version = "1.1.6", default-features = false, features = ["fs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10.9"
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# dev
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
webpki-roots = "1.0.12"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep debug builds small: full debuginfo made every test binary ~200 MB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Hashing 100+ MiB files in debug test builds is unbearably slow otherwise.
[profile.dev.package.blake3]
opt-level = 3
