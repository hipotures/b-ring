[package]
name = "bring-uniffi"
description = "UniFFI bindings exposing the B-Ring sync engine to Android (Kotlin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bring_uniffi"

[dependencies]
bring-core.workspace = true
uniffi.workspace = true

# Not inheriting workspace lints: the UniFFI macros generate `unsafe` FFI code,
# which the workspace-wide `unsafe_code = "forbid"` would reject.
[lints.clippy]
all = { level = "warn", priority = -1 }
