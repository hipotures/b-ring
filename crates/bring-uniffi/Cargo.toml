[package]
name = "bring-uniffi"
description = "UniFFI bindings exposing the B-Ring sync engine to Android (Kotlin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bring_uniffi"

# Kotlin binding generator, run by `android/build-rust.sh`. Behind a feature so
# normal builds do not compile the bindgen CLI.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
bring-core.workspace = true
getrandom.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Not inheriting workspace lints: the UniFFI macros generate `unsafe` FFI code,
# which the workspace-wide `unsafe_code = "forbid"` would reject.
[lints.clippy]
all = { level = "warn", priority = -1 }
